# 云端保活：Supabase 免费版项目「7 天无数据库请求」会被暂停。
#
# ⚠️ 2026-10-05 修正（原来这套是无效的，站点仍被警告要暂停）：
#   原实现访问 /auth/v1/health 与 /rest/v1/ 根路径 —— 两者都「不产生数据库活动」：
#     · /auth/v1/health 是 GoTrue 健康检查，根本不查库
#     · /rest/v1/ 根路径被网关直接拒绝（401 Invalid API key），请求没到 Postgres
#   而原脚本把 401 也算作"可达"，所以每天显示成功，实际什么都没保活。
#   官方口径：只有【数据库请求】才重置计时器（dashboard 停留、不查库的 API 调用都不算）。
#
# 现方案：带 anon key 做一次真实查询 GET /rest/v1/app_state?select=id&limit=1
#   → PostgREST 会真的执行 SELECT（返回 200 [] 即为成功），才算一次数据库活动。
# 关于 anon key：它是公开密钥（前端产物里本来就有），写在这里不增加暴露面；
#   若仓库 Secrets 里配了 SUPABASE_ANON_KEY / SUPABASE_URL，会优先使用 Secret。
name: 云端保活

on:
  schedule:
    # 每天 02:23 UTC = 北京 10:23（避开整点排队；每周一次就够，这里每天跑更保险）
    - cron: '23 2 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 真实数据库查询（只有查库才算活跃）
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -u
          BASE="${SUPABASE_URL:-https://katproevfecefydjztca.supabase.co}"
          BASE="${BASE%/}"
          KEY="${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImthdHByb2V2ZmVjZWZ5ZGp6dGNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MDQwMjQsImV4cCI6MjEwMzk4MDAyNH0.V0CEzofd5myEabRAEeTdC-DVv1LDoXfT7vgUlqJ4Xtk}"
          echo "保活目标：$BASE"

          fails=0
          check() {
            path="$1"
            code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 25               -H "apikey: $KEY" -H "Authorization: Bearer $KEY" "$BASE$path" || echo 000)
            echo "  GET $path → HTTP $code"
            head -c 200 /tmp/body 2>/dev/null; echo
            case "$code" in
              200|206) ;;
              *) fails=$((fails+1)) ;;
            esac
          }

          # 打到表上（会真正执行 SELECT，产生数据库活动）
          check "/rest/v1/app_state?select=id&limit=1"
          sleep 2
          # 再来一次，避免单次抖动；顺带覆盖另一条查询路径
          check "/rest/v1/app_state?select=*&limit=1"

          if [ "$fails" -gt 0 ]; then
            echo "::error::保活未取得 2xx —— 可能 anon 读不到该表（RLS 变更）、或项目已被暂停，请检查 Supabase 项目状态"
            exit 1
          fi
          echo "✅ 已完成真实数据库查询，Supabase 活跃计时器已重置"
